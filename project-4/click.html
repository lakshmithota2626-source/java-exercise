<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button Click Events</title>
</head>

<body>

    <h1>Button Click Events</h1>

    <p id="text">Click a button below</p>

    <button id="greetBtn">Greet</button>

    <button id="colorBtn">Change Colour</button>

    <h2>
        Counter: <span id="count">0</span>

    <button id="decBtn">- Decrease</button>

    <button id="resetBtn">Reset</button>

    <script src="click.js"></script>
