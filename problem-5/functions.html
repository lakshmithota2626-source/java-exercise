<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Types of Functions</title>
</head>

<body>

    <h1>Three Types of Functions</h1>

    <input type="number" id="a" placeholder="Enter first number">

    <input type="number" id="b" placeholder="Enter second number">

    <br><br>

    <button id="declBtn">
        Add (Declaration)
    </button>

    <button id="defBtn">
        Multiply (Definition)
    </button>

    <button id="arrowBtn">
        Square of A (Arrow)
    </button>

    <h3 id="result">
        Result will appear here
    </h3>

    <script src="functions.js"></script>

</body>
</html>
